<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог товаров учебного интернет-магазина.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Учебный интернет-магазин">
    <meta property="og:description" content="Учебный frontend-проект интернет-магазина.">
    <meta property="og:image" content="https://Rain658658.github.io/kr1-html-css-shop/images/preview.jpg">

    <title>Каталог товаров — Учебный интернет-магазин</title>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/custom.css">

    <script type="module" src="js/main.js" defer></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" id="topPanelNavBar"></nav>
  </header>


<main class="container my-5">
    <div class="alert alert-info" role="alert">
      Выберите товар из каталога. Карточки товаров оформлены с помощью компонента Bootstrap `card`.
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h2 mb-0">Каталог товаров</h1>
      <a class="btn btn-outline-primary" href="order.html">
        Оставить заявку
      </a>
    </div>
    <ul id="product-list" class="row g-4 list-unstyled" aria-label="Список задач"></ul>

  </main>
  
  <div
    class="modal fade"
    id="orderModal"
    tabindex="-1"
    aria-labelledby="orderModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="orderModalLabel">
            Быстрая заявка
          </h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Закрыть"
          ></button>
        </div>

        <div class="modal-body">
          <p class="text-muted">
            Оставьте контактные данные, и менеджер свяжется с вами.
          </p>

          <form>
            <div class="mb-3">
              <label for="modal-name" class="form-label">Имя</label>
              <input id="modal-name" type="text" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="modal-phone" class="form-label">Телефон</label>
              <input id="modal-phone" type="tel" class="form-control" required>
            </div>

            <div class="form-check mb-3">
              <input id="modal-agree" class="form-check-input" type="checkbox" required>
              <label class="form-check-label" for="modal-agree">
                Согласен на обработку данных
              </label>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Закрыть
          </button>
          <button type="button" class="btn btn-primary">
            Отправить
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center align-items-center">

    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>
  </div>
  <footer class="bg-dark text-white py-4 mt-5" id="footer"></footer>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
