<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/custom.css">
    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <header>
    <nav class="navbar navbar-expand-lg navbar-dark" id="topPanelNavBar"></nav>
    </header>

    <main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
            </div>

            <div class="card-body">
            <div class="alert alert-info" role="alert">
                Заполните форму. Поля со звёздочкой являются обязательными.
            </div>

            <form>
                <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="order-name" class="form-label">Имя *</label>
                    <input id="order-name" name="name" type="text" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="order-email" class="form-label">E-mail *</label>
                    <input id="order-email" name="email" type="email" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="order-phone" class="form-label">Телефон</label>
                    <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00">
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <label for="order-product" class="form-label">Товар</label>
                    <select id="order-product" name="product" class="form-select">
                    <option selected>Выберите товар</option>
                    <option value="product-1">Товар 1</option>
                    <option value="product-2">Товар 2</option>
                    <option value="product-3">Товар 3</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="order-comment" class="form-label">Комментарий</label>
                    <textarea id="order-comment" name="comment" class="form-control" rows="4"></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">
                        Я согласен на обработку данных *
                    </label>
                    </div>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">
                    Отправить заявку
                    </button>
                    <button class="btn btn-outline-secondary" type="reset">
                    Очистить
                    </button>
                </div>
                </div>
            </form>
            </div>
        </div>
        </div>
    </div>
    </main>


    <footer class="bg-dark text-white py-4 mt-5" id="footer"></footer>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
